    :root {
      --bg: #f7f5f0;
      --card-bg: #efeae1;
      --text: #161615;
      --muted: #6b6861;
      --border: #d8d3c8;
      --accent: #b8332a;
      --available: #2a6f48;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --arabic: 'IBM Plex Sans Arabic', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.5;
      padding: 2.5rem 2rem 5rem;
      max-width: 1320px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }

    /* Header */
    header {
      border-bottom: 1.5px solid var(--text);
      padding-bottom: 1.5rem;
      margin-bottom: 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .title-group h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .title-group .ar-title {
      font-family: var(--arabic);
      font-size: 1.35rem;
      font-weight: 600;
      margin-top: 0.2rem;
      display: block;
    }

    .header-meta {
      font-family: var(--mono);
      font-size: 0.8rem;
      color: var(--muted);
      text-align: right;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Intro & Filter Bar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .intro-text {
      max-width: 580px;
      font-size: 0.95rem;
      color: var(--muted);
    }

      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
